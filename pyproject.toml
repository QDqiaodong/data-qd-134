[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-134"
version = "0.1.0"
description = "Half-open booking interval sweep and capacity exceedance evidence"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
venue-occupancy = "venue_occupancy.cli:main"
venue-energy = "venue_energy.cli:main"
venue-recall = "venue_recall.cli:main"
venue-clearing = "venue_clearing.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
